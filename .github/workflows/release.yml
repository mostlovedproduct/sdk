name: Release

# Stages the three packages on npm when a v<version> tag is pushed. Nothing goes live until a
# maintainer approves each staged version with 2FA on npmjs.com (Staged Packages) or with
# `npm stage approve`. Versions already published are skipped, so a failed run can be re-run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm # requires approval before it runs
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never restore a cache into a release build
      - run: npm install -g npm@^11.15.0 # npm stage publish needs 11.15.0 or later
      - run: npm ci
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./packages/core/package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run typecheck
      - name: Stage core, then mcp and web
        run: |
          for dir in core mcp web; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            (cd "packages/$dir" && npm stage publish)
          done
