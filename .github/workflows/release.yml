name: Release

# Publishes the three packages when a v<version> tag is pushed. Versions already on npm are
# skipped, so a failed run can be re-run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm # requires approval before it runs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11 # trusted publishing needs npm 11.5.1 or later
      - run: npm ci
      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./packages/core/package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm test
      - run: npm run typecheck
      - name: Publish core, then mcp and web
        run: |
          for dir in core mcp web; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm"
              continue
            fi
            npm publish --workspace "packages/$dir" --provenance --access public
          done
        env:
          # Only for the first release, before each package has a trusted publisher. Remove it then.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
